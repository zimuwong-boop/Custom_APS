services:
  aps:
    build: .
    image: custom-aps:local
    ports:
      - "127.0.0.1:${APS_PORT:-8000}:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Create .env with SECRET_KEY before starting}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    volumes:
      - aps_data:/data
    restart: unless-stopped
volumes:
  aps_data:
    name: custom_aps_data
